name: Build and deploy containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Os valores configuráveis têm defaults para o ambiente Azure já criado.
  # Assim, a ausência de uma GitHub Variable não interrompe o deploy.
  ACR_NAME: ${{ vars.ACR_NAME || 'streetflowregistry' }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_NAME || 'streetflowregistry' }}.azurecr.io
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'street-flow-rg' }}
  CONTAINER_APP_API_NAME: ${{ vars.CONTAINER_APP_API_NAME || 'streetflow-api' }}
  CONTAINER_APP_WEB_NAME: ${{ vars.CONTAINER_APP_WEB_NAME || 'streetflow-web' }}
  CONTAINER_APP_WORKER_NAME: ${{ vars.CONTAINER_APP_WORKER_NAME || 'streetflow-order-worker' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run lint
          npm --prefix apps/api test -- --runInBand

      - name: Authenticate with Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/streetflow-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/streetflow-api:latest

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/streetflow-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/streetflow-web:latest

      - name: Build and publish worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/order-worker/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/streetflow-order-worker:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/streetflow-order-worker:latest

      - name: Deploy new revisions
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_API_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/streetflow-api:$IMAGE_TAG"

          az containerapp update \
            --name "$CONTAINER_APP_WEB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/streetflow-web:$IMAGE_TAG"

          az containerapp update \
            --name "$CONTAINER_APP_WORKER_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/streetflow-order-worker:$IMAGE_TAG"
