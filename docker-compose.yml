version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: street-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: streetflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pa@4816905
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
