apiVersion: apps/v1
kind: Deployment
metadata:
  name: streetflow-api
  namespace: streetflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streetflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streetflow-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: streetflow-api
      containers:
        - name: api
          image: streetflowregistry.azurecr.io/streetflow-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: DB_AUTH_MODE
              value: managed-identity
            - name: DB_HOST
              value: street-flow-db.postgres.database.azure.com
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: postgres
            - name: DB_USER
              value: streetflow-aks-api
            - name: DATABASE_SSL
              value: "true"
            - name: TYPEORM_SYNCHRONIZE
              value: "false"
            - name: SERVICE_BUS_ORDERS_TOPIC
              value: pedidos
            - name: SERVICE_BUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: streetflow-runtime-secrets
                  key: service-bus-api-connection
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: streetflow-api
  namespace: streetflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streetflow-api
  ports:
    - name: http
      port: 3000
      targetPort: http
